name = "wireless-canvas-api"
main = "src/index.ts"
compatibility_date = "2026-08-29"
workers_dev = true
preview_urls = false
send_metrics = false

[vars]
ARK_API_BASE = "https://ark.cn-beijing.volces.com/api/v3"
OPENSPEECH_API_BASE = "https://openspeech.bytedance.com/api/v3"
SEEDREAM_MODEL_ID = ""
SEEDANCE_MODEL_ID = ""
ARK_TEXT_MODEL_ID = ""
OPENSPEECH_RESOURCE_ID = ""
DEVICE_TOKEN_TTL_SECONDS = "86400"
UPSTREAM_TIMEOUT_MS = "30000"
SNAPSHOT_KV_THRESHOLD_BYTES = "65536"
INVITE_CODES = ""
CORS_ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "wireless-canvas"
database_id = "751dc60d-52af-4de8-9115-71266e26560e"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SNAPSHOT_CACHE"
id = "a0029b898cd94292a921ea43f62ac0a6"

[secrets]
required = [
  "DEVICE_TOKEN_SECRET",
  "ADMIN_TOKEN",
  "ARK_API_KEY",
  "OPENSPEECH_API_KEY",
]
