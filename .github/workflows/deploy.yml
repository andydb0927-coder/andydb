name: Deploy wireless canvas to GitHub Pages

on:
  push:
    branches: [codex/platform-shell-phase]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm --prefix app ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Backend unit tests
        run: npm --prefix backend run test:run

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm --prefix app run typecheck

      - name: Unit tests
        run: npm --prefix app run test:run

      - name: Build static site
        env:
          VITE_GENERATION_MODE: mock
        run: npm --prefix app run build:mock

      - name: End-to-end tests
        env:
          PLAYWRIGHT_OFFLINE_DIST: dist
        run: npm --prefix app run e2e

      - name: Publish app/dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          publish_branch: gh-pages
          force_orphan: true
